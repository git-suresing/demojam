---
- name: Bastion server configuration
  hosts: all
  become: yes
  gather_facts: no
  vars:
    version: "4.22.12"
    ocpversion: "4.22"
    release_arch: "x86_64"
    cmd: "openshift-install"
    pullsecret_file: "/root/.docker/config.json"
    extract_dir: "/root/"
  tasks:
    - name: Set RELEASE_IMAGE variable
      shell: >
        curl -s https://mirror.openshift.com/pub/openshift-v4/{{ release_arch }}/clients/ocp/{{ version }}/release.txt |
        grep 'Pull From: quay.io' |
        awk -F ' ' '{print $3}'
      register: release_image_cmd
      changed_when: false

    - name: Set fact for RELEASE_IMAGE
      set_fact:
        release_image: "{{ release_image_cmd.stdout }}"

    - name: Download openshift-client tarball
      get_url:
        url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ version }}/openshift-client-linux.tar.gz"
        dest: "./openshift-client-linux.tar.gz"

    - name: Extract oc binary
      unarchive:
        src: "./openshift-client-linux.tar.gz"
        dest: "./"
        remote_src: yes
        extra_opts: [ "--wildcards", "oc" ]

    - name: Remove openshift-client tarball
      file:
        path: "./openshift-client-linux.tar.gz"
        state: absent

    - name: Move oc to /usr/bin
      become: yes
      copy:
        src: "./oc"
        dest: "/usr/bin/oc"
        mode: '0755'
        remote_src: yes

    - name: Extract openshift-install from release image
      become: yes
      shell: >
        oc adm release extract
        --registry-config {{ pullsecret_file }}
        --command={{ cmd }}
        --to {{ extract_dir }}
        {{ release_image }}
      args:
        executable: /bin/bash

    - name: Move openshift-install to /usr/local/bin
      become: yes
      copy:
        src: "/root/openshift-install"
        dest: "/usr/bin/openshift-install"
        mode: '0755'
        remote_src: yes

    - name: Download oc-mirror
      get_url:
        url: "https://mirror.openshift.com/pub/openshift-v4/{{ release_arch }}/clients/ocp/{{ version }}/oc-mirror.tar.gz"
        dest: "/root/oc-mirror.tar.gz"

    - name: Extract oc-mirror
      shell: tar -xvf /root/oc-mirror.tar.gz
      args:
        chdir: "{{ extract_dir }}"
        executable: /bin/bash

    - name: Set permissions and move oc-mirror to /usr/bin
      become: yes
      shell: |
        chmod u+x oc-mirror
        mv oc-mirror /usr/bin/
      args:
        chdir: "{{ extract_dir }}"
        executable: /bin/bash